# alembic.ini — ver .cursor/specs/fase3.spec.md, secao 9.
#
# A URL real do banco NAO fica aqui: migrations/env.py le DATABASE_URL do
# ambiente (mesma variavel usada pela aplicacao, ver .env.example) e cai
# para o valor abaixo so como placeholder de desenvolvimento local.

[alembic]
script_location = migrations
prepend_sys_path = . src
sqlalchemy.url = postgresql+asyncpg://auditor:auditor@localhost:5433/auditor

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
