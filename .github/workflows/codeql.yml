name: CodeQL

# SAST do código da aplicação (Python e TypeScript): análise de fluxo de dados
# (entrada do usuário até SQL, URL, comando, HTML). Gratuito em repositório
# público. Os achados aparecem na aba Security > Code scanning e como anotação
# no PR. Para bloquear o merge, exija o check "CodeQL" na regra de proteção da
# main (docs/devops/workflows-explicados.md). Terraform, Dockerfile e Actions
# ficam com o Semgrep (security.yml), que o CodeQL não cobre.
#
# Atenção: não habilite também o "default setup" do CodeQL nas configurações do
# repositório; os dois conflitam.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - ".github/workflows/codeql.yml"
  push:
    branches: ["release/**"]
  schedule:
    - cron: "0 8 * * 1" # segunda, 08:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - tests
              - "**/*.spec.ts"
              - "**/node_modules"

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
