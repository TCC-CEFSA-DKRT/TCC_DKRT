name: CI Infra

# Quando o PR toca infra/terraform/**: terraform fmt -check e validate bloqueiam;
# o plan é publicado para revisão humana (não bloqueia). Nunca há apply aqui: o
# apply é sempre manual, em infra-apply.yml.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/ci-infra.yml"
  push:
    branches: ["release/**"]
    paths:
      - "infra/terraform/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff infra/terraform

  validate:
    name: terraform validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - bootstrap
          - environments/dev
          - environments/homolog
          - environments/production
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  plan:
    name: terraform plan (${{ matrix.env }}, informativo)
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    # Só em PR do próprio repositório (PR de fork não recebe token OIDC) e só
    # depois que o bootstrap criou o papel de plan.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != ''
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, homolog, production]
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      # Os valores não secretos do ambiente (domínios, URL do Orion...) ficam na
      # variável de repositório TFVARS_<AMBIENTE>, no formato do
      # terraform.tfvars.example.
      - name: terraform plan
        env:
          TFVARS_DEV: ${{ vars.TFVARS_DEV }}
          TFVARS_HOMOLOG: ${{ vars.TFVARS_HOMOLOG }}
          TFVARS_PRODUCTION: ${{ vars.TFVARS_PRODUCTION }}
        run: |
          VAR_NAME="TFVARS_$(echo '${{ matrix.env }}' | tr '[:lower:]' '[:upper:]')"
          printf '%s\n' "${!VAR_NAME}" > terraform.tfvars
          terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan | tee plan.txt
          {
            echo "### terraform plan: ${{ matrix.env }}"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
