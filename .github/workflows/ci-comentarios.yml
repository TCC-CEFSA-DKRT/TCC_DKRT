name: CI Comentários

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-comentarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comentarios:
    name: Comentários novos no código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Houve mudança no frontend?
        id: changed
        run: |
          git fetch --no-tags origin main
          if git diff --name-only --diff-filter=ACMR origin/main...HEAD -- frontend/src | grep -q .; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python (src, tests, scripts)
        run: python scripts/ci/check_no_comments.py --base origin/main

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.frontend == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar o TypeScript do frontend
        if: steps.changed.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: TypeScript, HTML e SCSS (frontend/src)
        if: steps.changed.outputs.frontend == 'true'
        run: node scripts/ci/check_no_comments_frontend.js --base origin/main
