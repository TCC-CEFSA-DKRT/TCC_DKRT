name: Segurança

# Seção 3.1 do manual: pip-audit, npm audit e varredura de segredos, mais
# Semgrep para IaC (o SAST do código está em codeql.yml; o manual não exige
# SAST, foi adicionado). Roda em
# PR para a main, em push em release/*, antes das implantações e semanalmente
# (novas vulnerabilidades surgem mesmo sem commits).

on:
  pull_request:
    branches: [main]
  push:
    branches: ["release/**"]
  schedule:
    - cron: "0 7 * * 1" # segunda, 07:00 UTC
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pip-audit

      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt --desc

  npm-audit:
    name: npm audit (produção, críticas e altas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CLI em contêiner: a action oficial exige licença para repositórios de organização.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact --verbose

  # Semgrep CE (gratuito, sem conta nem token) para o que o CodeQL não cobre:
  # Terraform, Dockerfile e workflows do GitHub Actions. O SAST do código da
  # aplicação (Python/TypeScript) é o CodeQL, em codeql.yml. Em PR/release/deploy
  # só entram achados NOVOS em relação à main (o débito antigo não bloqueia, como
  # no ruff); só severidade ERROR reprova. No cron semanal varre tudo e não bloqueia.
  semgrep-config:
    name: Semgrep (Terraform, Dockerfile, Actions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet semgrep==1.97.0

      - name: semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          ARGS=""
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            git fetch --no-tags origin main
            printf '* -text\n' >> "$(git rev-parse --git-common-dir)/info/attributes"
            ARGS="--baseline-commit $(git merge-base origin/main HEAD)"
          fi
          semgrep scan $ARGS --metrics=off --severity ERROR --error \
            --config p/terraform --config p/dockerfile --config p/github-actions \
            infra Dockerfile selfhosted .github \
            || [ "$GITHUB_EVENT_NAME" = "schedule" ]
