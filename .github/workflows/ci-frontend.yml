name: CI Frontend

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: ["release/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: ng test e ng build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # karma.conf.js já define o launcher ChromeHeadlessNoSandbox.
      - name: ng test (Chrome headless)
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: ng build (produção)
        run: npm run build -- --configuration production
