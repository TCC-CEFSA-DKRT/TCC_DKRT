[project]
name = "context-broker-multiagent"
version = "0.1.0"
description = "DKRT — Sistema multiagentes para FIWARE Context Broker com CLI, SLM, RAG e MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TCC DKRT" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
]
slm = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]

[project.scripts]
dkrt = "context_broker_multiagent.terminal:main"
dkrt-tools = "context_broker_multiagent.cli:app"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requer Orion Context Broker em execução",
]
