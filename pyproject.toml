[project]
name = "fiware-conformance-auditor"
version = "0.1.0"
description = "Auditor de Conformidade FIWARE — audita entidades do Orion Context Broker (NGSI-v2) contra Smart Data Models, com validacao estrutural deterministica (Nivel 1) e diagnostico semantico via SLM/RAG (Nivel 2)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TCC - Auditor de Conformidade FIWARE" }]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pysmartdatamodels>=0.8.0.9",
    "pgvector>=0.3.0",
    "sentence-transformers>=3.0.0",
    "PyYAML>=6.0",
    # ADR-0017: API/Worker de producao rodam como Lambda (imagem de
    # conteiner) atras do ALB -- boto3 (Parameter Store em runtime) e
    # mangum (adapter ASGI->Lambda para a mesma app FastAPI) sao
    # dependencias de runtime, nao so' de teste/dev daqui em diante.
    "boto3>=1.34.0",
    "mangum>=0.17.0",
    "cryptography>=42.0.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.8.0",
    # Issue #23 / ADR-0022: PDF do relatorio gerado no backend; tzdata
    # garante os fusos horarios (datas do PDF) mesmo sem base de fusos do
    # sistema operacional (Windows, imagem do Lambda).
    "reportlab>=4.2",
    "tzdata>=2024.1",
]

[project.scripts]
audit = "auditor.interfaces.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres]>=4.0.0",
    "moto[sqs]>=5.0.0",
    "boto3>=1.34.0",
    "jsonschema>=4.21.0",
    # Issue #23: os testes leem o texto do PDF gerado.
    "pypdf>=4.0",
    "locust>=2.29.0",
]
aws = [
    "boto3>=1.34.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requer infraestrutura externa (Orion, Postgres) em execucao",
    "req(id): requisito (RF-xx/RNF-xx) rastreado pelo caso de teste — ver tests/qualidade",
    "tecnica(nome): tecnica de projeto de teste (CE, AVL, TD, CB)",
    "golden: requer Ollama real (Qwen2.5) rodando localmente — detecta regressao de prompt/modelo (Fase 7)",
]
