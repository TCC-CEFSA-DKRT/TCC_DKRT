services:
  mongo:
    image: mongo:4.4
    command: --nojournal
    ports:
      - "27017:27017"

  orion:
    image: fiware/orion:3.10.1
    platform: linux/amd64
    depends_on:
      - mongo
    ports:
      - "1026:1026"
    command: -dbhost mongo -logLevel DEBUG
    environment:
      - ORION_MULTI_SERVICE=TRUE

  crate-db:
    image: crate:5.11
    command: crate -Cnetwork.host=0.0.0.0
    ports:
      - "4200:4200"
      - "4300:4300"

  quantumleap:
    image: orchestracities/quantumleap:latest
    depends_on:
      - crate-db
    ports:
      - "8668:8668"
    environment:
      - CRATE_HOST=crate-db

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"

  iot-agent-mqtt:
    image: fiware/iotagent-json:latest
    depends_on:
      - mongo
      - orion
      - mosquitto
    ports:
      - "4041:4041"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_HOST=mongo
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagentjson
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=1883
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - IOTA_PROVIDER_URL=http://iot-agent-mqtt:4041