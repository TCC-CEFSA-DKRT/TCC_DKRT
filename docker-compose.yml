services:
  mongo:
    image: mongo:4.4
    command: --nojournal
    ports:
      - "27017:27017"

  orion:
    image: fiware/orion:3.10.1
    platform: linux/amd64
    depends_on:
      - mongo
    ports:
      - "1026:1026"
    command: -dbhost mongo -logLevel DEBUG
    environment:
      - ORION_MULTI_SERVICE=TRUE

  crate-db:
    image: crate:5.11
    command: crate -Cnetwork.host=0.0.0.0
    ports:
      - "4200:4200"
      - "4300:4300"

  quantumleap:
    image: orchestracities/quantumleap:latest
    depends_on:
      - crate-db
    ports:
      - "8668:8668"
    environment:
      - CRATE_HOST=crate-db